<!DOCTYPE html> <html lang="es"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0"> <title>Mensaje del Creador</title> <style> body{ margin:0; background:#050505; display:flex; justify-content:center; align-items:center; height:100vh; font-family:Consolas, monospace; transition:1s; } .monitor{ width:800px; max-width:95%; background:#111; border:10px solid #444; border-radius:20px; box-shadow:0 0 40px #00ff00; padding:20px; } .screen{ background:black; color:#00ff00; min-height:450px; padding:20px; font-size:20px; } button{ margin:10px; padding:10px 25px; font-size:18px; cursor:pointer; } .red{ background:#8b0000 !important; } </style> </head> <body> <div class="monitor"> <div class="screen" id="screen"> Pulsa para empezar.<br><br> <button onclick="inicio()">INICIAR</button> </div> </div> <script> const screen = document.getElementById("screen"); function escribir(texto){ screen.innerHTML += texto + "<br>"; } function inicio(){ screen.innerHTML=""; setTimeout(()=>{ escribir("Hola jugador."); },1000); setTimeout(()=>{ escribir(""); escribir("Este juego es simplemente un mensaje del creador hacia sus jugadores."); },3000); setTimeout(()=>{ escribir(""); escribir("Escaneando dispositivo..."); },6000); setTimeout(()=>{ screen.innerHTML += ` <br> ¿Quieres seguir con el procedimiento?<br><br> <button onclick="seguir()">Sí</button> <button onclick="cerrarJuego()">No</button> `; },8500); } function cerrarJuego(){ screen.innerHTML = ` <h2>Juego cerrado.</h2> `; } function seguir(){ screen.innerHTML=""; escribir("Seguro Teo?"); setTimeout(()=>{ escribir(""); escribir("Cargando..."); escribir("Analizando..."); escribir("Generando informe..."); },1500); setTimeout(()=>{ escribir(""); escribir("Teo Julves Abril Billar"); escribir("Edad: 12"); },4500); setTimeout(()=>{ screen.innerHTML += ` <br><br> ¿Quieres que se analice tu IP? <br><br> <button onclick="siIP()">Sí</button> <button onclick="noIP()">No</button> `; },6500); } function siIP(){ document.body.classList.add("red"); screen.innerHTML = ` <h1 style="color:white;text-align:center;"> 😂 ERA BROMIS 😂 <br><br> CASATE CON LA AINOA </h1> `; } function noIP(){ screen.innerHTML = ` <h1 style="text-align:center;"> 😂 ERA BROMA 😂 <br><br> TE VAS CON LA MILAGROS </h1> `; } </script> </body> </html>
